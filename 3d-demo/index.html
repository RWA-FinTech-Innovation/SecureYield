    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <script>
      (() => {
        const rewritePort8080Url = (raw) => {
          try {
            const url = new URL(raw, window.location.href);
            if (url.port === '8080' && (url.hostname === '127.0.0.1' || url.hostname === 'localhost')) {
              return `${window.location.origin}${url.pathname}${url.search}${url.hash}`;
            }
          } catch {}
          return raw;
        };

        const originalFetch = window.fetch?.bind(window);
        if (originalFetch) {
          window.fetch = (input, init) => {
            if (input instanceof Request) {
              const rewrittenUrl = rewritePort8080Url(input.url);
              if (rewrittenUrl === input.url) return originalFetch(input, init);
              return originalFetch(new Request(rewrittenUrl, input), init);
            }
            const raw = input instanceof URL ? input.toString() : input;
            return originalFetch(rewritePort8080Url(raw), init);
          };
        }

        if (window.XMLHttpRequest) {
          const originalOpen = window.XMLHttpRequest.prototype.open;
          window.XMLHttpRequest.prototype.open = function (method, url, ...rest) {
            return originalOpen.call(this, method, rewritePort8080Url(url), ...rest);
          };
        }
      })();
    </script>
